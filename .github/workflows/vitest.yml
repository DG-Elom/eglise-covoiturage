name: Vitest

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Ce job BLOQUE le merge en cas d'échec (pas de continue-on-error).
    # Il ne touche aucune DB ni aucun service externe.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test

      - name: Type check
        run: npx tsc --noEmit
